[test]
# plugins-enabled/ holds links to plugins, and a plugin kept in a repository of its
# own is linked from outside this tree: its tests run in its own repository, where
# they are isolated from one another. The bundled plugins' tests run from
# plugins-available/.
pathIgnorePatterns = ["plugins-enabled/**"]
# Every test makes its temporary files under one run root, removed at the end, and
# starts without the host's trust records (the helpers say why).
preload = ["./src/__tests__/helpers/tmp-root.ts", "./src/__tests__/helpers/test-setup.ts"]
